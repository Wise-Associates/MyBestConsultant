version: '3.8'

services:
  appwrite:
    image: appwrite/appwrite:1.5.7
    container_name: appwrite
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    networks:
      - appwrite
    depends_on:
      - appwrite-mariadb
      - appwrite-redis
    environment:
      - _APP_ENV=development
      - _APP_LOCALE=fr
      - _APP_CONSOLE_WHITELIST_ROOT=enabled
      - _APP_CONSOLE_WHITELIST_EMAILS=
      - _APP_CONSOLE_WHITELIST_IPS=
      - _APP_OPENSSL_KEY_V1=your-secret-key-change-this
      - _APP_DOMAIN=localhost
      - _APP_DOMAIN_TARGET=localhost
      - _APP_REDIS_HOST=appwrite-redis
      - _APP_REDIS_PORT=6379
      - _APP_DB_HOST=appwrite-mariadb
      - _APP_DB_PORT=3306
      - _APP_DB_SCHEMA=appwrite
      - _APP_DB_USER=appwrite
      - _APP_DB_PASS=appwrite_password
      - _APP_SMTP_HOST=
      - _APP_SMTP_PORT=
      - _APP_SMTP_SECURE=
      - _APP_SMTP_USERNAME=
      - _APP_SMTP_PASSWORD=
      - _APP_STORAGE_LIMIT=30000000
      - _APP_FUNCTIONS_SIZE_LIMIT=30000000

  appwrite-realtime:
    image: appwrite/appwrite:1.5.7
    entrypoint: realtime
    container_name: appwrite-realtime
    restart: unless-stopped
    networks:
      - appwrite
    depends_on:
      - appwrite-mariadb
      - appwrite-redis
    environment:
      - _APP_ENV=development
      - _APP_REDIS_HOST=appwrite-redis
      - _APP_REDIS_PORT=6379
      - _APP_DB_HOST=appwrite-mariadb
      - _APP_DB_PORT=3306
      - _APP_DB_SCHEMA=appwrite
      - _APP_DB_USER=appwrite
      - _APP_DB_PASS=appwrite_password

  appwrite-worker-audits:
    image: appwrite/appwrite:1.5.7
    entrypoint: worker-audits
    container_name: appwrite-worker-audits
    restart: unless-stopped
    networks:
      - appwrite
    depends_on:
      - appwrite-redis
      - appwrite-mariadb
    environment:
      - _APP_ENV=development
      - _APP_REDIS_HOST=appwrite-redis
      - _APP_REDIS_PORT=6379
      - _APP_DB_HOST=appwrite-mariadb
      - _APP_DB_PORT=3306
      - _APP_DB_SCHEMA=appwrite
      - _APP_DB_USER=appwrite
      - _APP_DB_PASS=appwrite_password

  appwrite-mariadb:
    image: mariadb:10.11
    container_name: appwrite-mariadb
    restart: unless-stopped
    networks:
      - appwrite
    volumes:
      - appwrite-mariadb:/var/lib/mysql
    environment:
      - MYSQL_ROOT_PASSWORD=rootpassword
      - MYSQL_DATABASE=appwrite
      - MYSQL_USER=appwrite
      - MYSQL_PASSWORD=appwrite_password

  appwrite-redis:
    image: redis:7-alpine
    container_name: appwrite-redis
    restart: unless-stopped
    networks:
      - appwrite
    volumes:
      - appwrite-redis:/data

networks:
  appwrite:
    driver: bridge

volumes:
  appwrite-mariadb:
  appwrite-redis:
