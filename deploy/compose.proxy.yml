# Proxy HTTPS du VPS (ADR 0027, docs/deploiement-vps.md) : seul conteneur exposé sur Internet.
# Démarré par mbc-deploy s'il ne tourne pas ; une modification de ce fichier ne s'applique que par
# `sudo -u deploy mbc-deploy proxy` (le déploiement le signale), jamais pendant une bascule.
services:
  caddy:
    # Version et empreinte exactes : une image locale réétiquetée « caddy:… » ne peut pas prendre sa place.
    # Les monter ensemble par une pull request (docker buildx imagetools inspect caddy:<version>), puis `mbc-deploy proxy`.
    image: caddy:2.11.7-alpine@sha256:e70b164da81ef698b3ad19af799ea6086ce6d9e48ed4079eb9fe26f6fbf14ee5
    container_name: mbc-caddy
    restart: unless-stopped
    # Seul conteneur exposé à Internet : aucun droit au-delà de l'ouverture des ports 80 et 443, système en lecture
    # seule (ses données vont dans les volumes /data et /config).
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    # Caddy répond sur son interface d'administration (celle qu'utilise le rechargement) : prêt à servir.
    # 127.0.0.1 et non localhost : wget essaie d'abord ::1, où l'interface n'écoute pas.
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2019/config/"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      start_interval: 1s
      retries: 3
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      # Le dossier et non le fichier : git remplace le fichier à chaque déploiement, un montage du seul fichier
      # garderait l'ancienne version.
      - ./caddy:/etc/caddy:ro
      # Couleur active (bleue ou verte), écrite par mbc-deploy.
      - ${MBC_ROOT:-/opt/mybestconsultant}/state:/mbc-state:ro
      # Certificats HTTPS : gardés d'un redémarrage à l'autre (sinon Let's Encrypt limite les nouvelles demandes).
      - caddy_data:/data
      - caddy_config:/config
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "5"
    # mbc : l'application. wise-site : réseau interne du site Wise Associates (dépôt TNP-Clone), que Caddy est le seul à
    # partager avec lui. Les deux sont créés par mbc-deploy s'ils manquent.
    networks: [mbc, wise-site]

volumes:
  caddy_data:
  caddy_config:

networks:
  mbc:
    external: true
  wise-site:
    external: true
