# Mise en production sur le VPS (ADR 0025 et 0027, docs/deploiement-vps.md).
#
# Lancée à la main seulement : onglet Actions → « Déployer en production » → Run workflow, branche main.
# - Champ vide : met en production le dernier commit de main. Vérification du code, construction de l'image, prod
#   placée sur ce commit (avance rapide, ou remplacement contrôlé : voir « Commit à déployer »), envoi au serveur,
#   bascule sans coupure (deploy/mbc-deploy.sh). Si main n'a pas changé depuis la dernière fois, redéploie la même
#   version.
# - Un commit : retour arrière vers une version de prod déjà mise en production ; prod n'est pas modifiée.
#
# Les pull requests vont vers main (« Rebase and merge »), et une fusion ne déploie rien. prod n'est modifiée que par
# ce workflow : elle pointe sur la dernière version mise en production.
#
# Deux jobs : « verify » exécute le code du dépôt et de ses dépendances (npm ci, tests) sans aucun secret ni droit
# d'écriture ; « deploy » détient la clé SSH et le jeton qui fait avancer prod, et n'exécute aucun code du dépôt sur la
# machine de GitHub (le build a lieu dans un conteneur Docker, qui n'a accès ni aux fichiers ni aux variables du job).
name: Déployer en production

on:
  workflow_dispatch:
    inputs:
      commit:
        description: "Retour arrière : commit de prod déjà mis en production (vide : mettre en production le dernier commit de main)"
        required: false
        default: ""

# Un déploiement à la fois, sans jamais en annuler un en cours (il serait coupé au milieu de la bascule).
concurrency:
  group: deploy-vps
  cancel-in-progress: false

permissions: {}

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      deployments: read
    outputs:
      commit: ${{ steps.commit.outputs.sha }}
      prod: ${{ steps.commit.outputs.prod }}
    steps:
      - name: Contrôles
        env:
          REQUESTED: ${{ inputs.commit }}
          VPS_HOST: ${{ vars.VPS_HOST }}
        run: |
          # Lancé depuis une autre branche, le workflow mettrait cette branche en production.
          if [[ $GITHUB_REF != refs/heads/main ]]; then
            echo "::error::Lancez ce workflow depuis la branche main (branche choisie : $GITHUB_REF_NAME)."
            exit 1
          fi
          if [[ -z $VPS_HOST ]]; then
            echo "::error::Variable de dépôt VPS_HOST absente : serveur pas encore configuré (docs/deploiement-vps.md, 4.2). Rien n'a été modifié."
            exit 1
          fi
          if [[ -n $REQUESTED && ! $REQUESTED =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Indiquez un commit complet (40 caractères hexadécimaux), ou laissez le champ vide."
            exit 1
          fi

      - name: Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit || github.sha }}
          # Historique complet : comparaison avec prod.
          fetch-depth: 0
          persist-credentials: false

      - name: Commit à déployer
        id: commit
        env:
          REQUESTED: ${{ inputs.commit }}
          GH_TOKEN: ${{ github.token }}
        run: |
          commit=$(git rev-parse HEAD)
          prod=$(git rev-parse origin/prod)
          if [[ -z $REQUESTED ]]; then
            # Cas normal : prod est un ancêtre du commit, elle avance. Sinon, prod a des commits que l'historique de
            # main n'a pas : un commit passé par prod puis entré dans main par « Rebase and merge » y a un autre
            # identifiant (rattrapage de l'ADR 0025, correction poussée sur prod). prod est alors remplacée, à la
            # seule condition que chacun de ces commits ait son équivalent dans main (même modification : git cherry) ;
            # sinon une modification de prod serait perdue. Le job deploy ne modifie prod que si elle est encore sur
            # le commit contrôlé ici.
            if ! git merge-base --is-ancestor "$prod" "$commit"; then
              cherry=$(git cherry -v "$commit" "$prod")
              missing=$(awk '/^\+/' <<<"$cherry")
              if [[ -n $missing ]]; then
                echo "::error::prod contient des modifications absentes de main : rien n'a été modifié. Faites-les entrer dans main par une pull request, puis relancez. Commits concernés (ci-dessous)."
                echo "$missing"
                exit 1
              fi
              echo "prod sera remplacée par $commit : ses $(wc -l <<<"$cherry") commits absents de l'historique de main y ont tous leur équivalent."
            fi
          else
            if ! git merge-base --is-ancestor "$commit" origin/prod; then
              echo "::error::Le commit $commit n'est pas dans la branche prod : refusé."
              exit 1
            fi
            # Un retour arrière ne vise qu'une version déjà mise en production (un commit intermédiaire d'une pull
            # request, jamais relu seul, est refusé). GitHub enregistre chaque déploiement de l'environnement production.
            count=$(gh api "repos/$GITHUB_REPOSITORY/deployments?environment=production&sha=$commit" --jq length)
            if [[ $count -eq 0 ]]; then
              echo "::error::Le commit $commit n'a jamais été mis en production : refusé."
              exit 1
            fi
          fi
          echo "sha=$commit" >> "$GITHUB_OUTPUT"
          echo "prod=$prod" >> "$GITHUB_OUTPUT"

      - name: Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Même version majeure que l'image (Dockerfile).
          node-version: "24"
          cache: npm

      - name: Dépendances
        run: npm ci --no-audit --no-fund

      # ESLint n'en fait pas partie : erreurs déjà présentes sur la branche (à corriger à part).
      - name: Vérification (types et tests)
        run: |
          npm run typecheck
          npm test

  deploy:
    needs: verify
    runs-on: ubuntu-24.04
    # Clé SSH, jeton de prod et valeurs publiques du build : environnement « production », limité à la branche main.
    environment: production
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.commit }}
          persist-credentials: false

      - name: Image
        env:
          COMMIT: ${{ needs.verify.outputs.commit }}
          NEXT_PUBLIC_APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL }}
          NEXT_PUBLIC_APPWRITE_ENDPOINT: ${{ vars.NEXT_PUBLIC_APPWRITE_ENDPOINT }}
          NEXT_PUBLIC_APPWRITE_PROJECT_ID: ${{ vars.NEXT_PUBLIC_APPWRITE_PROJECT_ID }}
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
        # --build-arg sans valeur : reprise de la variable d'environnement du même nom.
        run: |
          docker build --tag "mybestconsultant:$COMMIT" \
            --build-arg NEXT_PUBLIC_APP_URL \
            --build-arg NEXT_PUBLIC_APPWRITE_ENDPOINT \
            --build-arg NEXT_PUBLIC_APPWRITE_PROJECT_ID \
            --build-arg NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY \
            .

      # Après l'image (une image qui ne se construit pas ne touche pas prod), avant l'envoi (le serveur n'accepte qu'un
      # commit de prod). --force-with-lease : GitHub ne modifie prod que si elle est encore sur le commit contrôlé par
      # verify ; un commit arrivé sur prod entre-temps n'est jamais écrasé. Jeton dédié : GITHUB_TOKEN ne peut jamais
      # faire avancer une branche sur un commit qui modifie .github/workflows (ADR 0025).
      - name: Mise à jour de prod
        if: inputs.commit == ''
        env:
          COMMIT: ${{ needs.verify.outputs.commit }}
          PROD_BEFORE: ${{ needs.verify.outputs.prod }}
          GH_TOKEN: ${{ secrets.PROD_BRANCH_TOKEN }}
        run: |
          if [[ -z $GH_TOKEN ]]; then
            echo "::error::Secret PROD_BRANCH_TOKEN absent de l'environnement production (docs/deploiement-vps.md, 4.2). Rien n'a été déployé."
            exit 1
          fi
          # git demande le jeton à gh, qui le lit dans GH_TOKEN : il n'est écrit ni sur le disque ni dans la commande.
          gh auth setup-git
          if ! git push --force-with-lease="refs/heads/prod:$PROD_BEFORE" origin "$COMMIT:refs/heads/prod"; then
            echo "::error::prod n'a pas pu être placée sur $COMMIT (réponse de GitHub juste au-dessus ; docs/deploiement-vps.md, Dépannage). Rien n'a été déployé."
            exit 1
          fi
          echo "prod est sur $COMMIT."

      - name: Envoi au serveur et bascule
        env:
          COMMIT: ${{ needs.verify.outputs.commit }}
          VPS_HOST: ${{ vars.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_SSH_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
        # La clé ne peut lancer que mbc-deploy sur le serveur (command= dans authorized_keys). L'empreinte du serveur
        # est vérifiée (known_hosts) : pas de connexion à un serveur qui se ferait passer pour lui.
        run: |
          install -m 700 -d ~/.ssh
          (umask 077 && printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key)
          printf '%s\n' "$VPS_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          docker save "mybestconsultant:$COMMIT" | gzip -1 |
            ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ServerAliveInterval=30 \
              "deploy@$VPS_HOST" deploy "$COMMIT"
